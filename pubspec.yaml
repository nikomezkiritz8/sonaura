name: sonaura
description: Audiophile Hi-Res Music Player with AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  crypto: ^3.0.3
  google_fonts: ^6.1.0
  audioplayers: ^5.2.1
  flutter_tts: ^3.8.3
  speech_to_text: ^6.3.0
  path_provider: ^2.1.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
